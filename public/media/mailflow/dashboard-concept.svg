  <text x="56" y="268" fill="#8B8EA3" font-size="12">Every incoming message is cleaned, deduplicated, classified, scored for urgency, and routed</text>

  <!-- Email Item 1 (Selected) -->
  <rect x="52" y="288" width="620" height="80" rx="12" fill="#0D0E19" stroke="#FF6D5A" stroke-width="1.5"/>
  <text x="72" y="314" fill="#FFFFFF" font-size="13" font-weight="700">David Park · URGENT: Production API outage blocking checkout</text>
  <text x="72" y="335" fill="#B4B7C8" font-size="12">Extracted: ORD-2026-8812 · Routed to urgent_escalation_queue</text>
  <rect x="72" y="344" width="96" height="18" rx="9" fill="#2E1416"/>
  <text x="120" y="357" fill="#FCA5A5" font-size="10" font-weight="700" text-anchor="middle">HIGH PRIORITY</text>
  <rect x="176" y="344" width="94" height="18" rx="9" fill="#33202A"/>
  <text x="223" y="357" fill="#FFB4A6" font-size="10" font-weight="700" text-anchor="middle">Urgent Email</text>
  <rect x="536" y="344" width="120" height="18" rx="9" fill="#2E2410"/>
  <text x="596" y="357" fill="#FCD34D" font-size="10" font-weight="700" text-anchor="middle">Awaiting Approval</text>


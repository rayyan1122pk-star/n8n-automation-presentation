  <text x="52" y="156" fill="#FFFFFF" font-size="30" font-weight="700">218</text>
  <text x="140" y="154" fill="#FF6D5A" font-size="12" font-weight="600">7 AI Categories</text>

  <rect x="340" y="88" width="288" height="100" rx="14" fill="#13141F" stroke="#2A2B3A"/>
  <text x="360" y="116" fill="#8B8EA3" font-size="12" font-weight="600">HIGH PRIORITY / URGENT</text>
  <text x="360" y="156" fill="#FCA5A5" font-size="30" font-weight="700">14</text>
  <rect x="424" y="135" width="166" height="24" rx="12" fill="#2E1416"/>
  <text x="507" y="151" fill="#FCA5A5" font-size="11" font-weight="700" text-anchor="middle">Hybrid SLA Escalation</text>

  <rect x="648" y="88" width="288" height="100" rx="14" fill="#13141F" stroke="#2A2B3A"/>
  <text x="668" y="116" fill="#8B8EA3" font-size="12" font-weight="600">AWAITING HUMAN APPROVAL</text>
  <text x="668" y="156" fill="#F5F5FF" font-size="30" font-weight="700">19</text>
  <rect x="734" y="135" width="176" height="24" rx="12" fill="#2A1A22"/>
  <text x="822" y="151" fill="#FF8A73" font-size="11" font-weight="700" text-anchor="middle">Zero Unapproved Sends</text>

  <rect x="956" y="88" width="292" height="100" rx="14" fill="#13141F" stroke="#2A2B3A"/>
  <text x="976" y="116" fill="#8B8EA3" font-size="12" font-weight="600">AVG DRAFT READY TIME</text>
  <text x="976" y="156" fill="#FFFFFF" font-size="30" font-weight="700">2.4s</text>
  <text x="1064" y="154" fill="#6EE7B7" font-size="12" font-weight="600">Gemini Contextual Draft</text>


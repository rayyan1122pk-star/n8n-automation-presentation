<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="mailPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A73"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0A0B14"/>

  <!-- Top Header -->
  <rect width="1280" height="64" fill="#13141F"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#2A2B3A" stroke-width="1"/>
  <rect x="32" y="18" width="28" height="28" rx="8" fill="url(#mailPurple)"/>
  <text x="46" y="37" fill="#13141F" font-size="14" font-weight="700" text-anchor="middle">M</text>
  <text x="72" y="33" fill="#FFFFFF" font-size="16" font-weight="700">MailFlow AI Triage &amp; Approval Console</text>
  <text x="72" y="50" fill="#8B8EA3" font-size="11">Semantic Classification, Priority Detection &amp; Human-Approved Drafts</text>

  <!-- Honest Concept Preview Badge -->
  <rect x="920" y="18" width="328" height="28" rx="14" fill="#2A1A22" stroke="#5A2E33" stroke-width="1"/>
  <circle cx="938" cy="32" r="4" fill="#FF6D5A"/>
  <text x="950" y="36" fill="#FFB4A6" font-size="11" font-weight="700">CONCEPT PREVIEW · STATIC PRESENTATION VISUAL</text>

  <!-- KPI Row -->
  <rect x="32" y="88" width="288" height="100" rx="14" fill="#13141F" stroke="#2A2B3A"/>

  <rect x="52" y="380" width="620" height="74" rx="12" fill="#13141F" stroke="#2A2B3A"/>
  <text x="72" y="405" fill="#FFFFFF" font-size="13" font-weight="700">Amira Al-Mansoor · Enterprise plan pricing and quote request</text>
  <text x="72" y="425" fill="#8B8EA3" font-size="12">Routed to sales_pipeline_queue · Contextual draft generated</text>
  <rect x="72" y="432" width="90" height="17" rx="8" fill="#1A1B28"/>
  <text x="117" y="444" fill="#D1D3E0" font-size="10" font-weight="700" text-anchor="middle">Sales Inquiry</text>
  <rect x="170" y="432" width="66" height="17" rx="8" fill="#1E2036"/>
  <text x="203" y="444" fill="#A5B4FC" font-size="10" font-weight="700" text-anchor="middle">Medium</text>
  <rect x="556" y="432" width="100" height="17" rx="8" fill="#0E2A22"/>
  <text x="606" y="444" fill="#6EE7B7" font-size="10" font-weight="700" text-anchor="middle">Approved Ready</text>

  <!-- Email Item 3 -->
  <rect x="52" y="466" width="620" height="74" rx="12" fill="#13141F" stroke="#2A2B3A"/>
  <text x="72" y="491" fill="#FFFFFF" font-size="13" font-weight="700">Billing Dept · Invoice INV-2026-4410 Payment Due ($1,250.00)</text>
  <text x="72" y="511" fill="#8B8EA3" font-size="12">Extracted: INV-2026-4410, $1,250.00, 2026-12-01 · billing_accounts_queue</text>
  <rect x="72" y="518" width="64" height="17" rx="8" fill="#2A1A22"/>
  <text x="104" y="530" fill="#FF8A73" font-size="10" font-weight="700" text-anchor="middle">Invoice</text>
  <rect x="144" y="518" width="66" height="17" rx="8" fill="#1E2036"/>
  <text x="177" y="530" fill="#A5B4FC" font-size="10" font-weight="700" text-anchor="middle">Medium</text>

  <!-- Email Item 4 -->
  <rect x="52" y="552" width="620" height="74" rx="12" fill="#13141F" stroke="#2A2B3A"/>
  <text x="72" y="577" fill="#FFFFFF" font-size="13" font-weight="700">Lucas Meyer · Schedule a call next week for Q4 partnership review</text>
  <text x="72" y="597" fill="#8B8EA3" font-size="12">Extracted: Tuesday, 10:00 AM · executive_calendar_queue</text>
  <rect x="72" y="604" width="110" height="17" rx="8" fill="#1A1B28"/>
  <text x="127" y="616" fill="#D1D3E0" font-size="10" font-weight="700" text-anchor="middle">Meeting Request</text>
  <rect x="190" y="604" width="52" height="17" rx="8" fill="#0E2A22"/>
  <text x="216" y="616" fill="#6EE7B7" font-size="10" font-weight="700" text-anchor="middle">Low</text>

  <!-- Right Panel: Human-in-the-Loop Approval Draft Review -->
  <rect x="716" y="212" width="532" height="450" rx="16" fill="#13141F" stroke="#2A2B3A"/>
  <text x="740" y="248" fill="#FFFFFF" font-size="16" font-weight="700">Human Approval Review Panel</text>
  <text x="740" y="268" fill="#8B8EA3" font-size="12">AI drafts are held in review until explicitly approved by a human reviewer</text>

  <!-- Draft Box -->
  <rect x="740" y="288" width="484" height="248" rx="12" fill="#0A0B14" stroke="#2A2B3A"/>
  <text x="760" y="314" fill="#8B8EA3" font-size="11" font-weight="700">PROPOSED REPLY SUBJECT</text>
  <text x="760" y="334" fill="#FFFFFF" font-size="13" font-weight="700">Re: URGENT: Production API outage blocking checkout</text>
  <line x1="760" y1="348" x2="1204" y2="348" stroke="#2A2B3A"/>
  <text x="760" y="372" fill="#D1D3E0" font-size="12">Hello David Park,</text>
  <text x="760" y="396" fill="#D1D3E0" font-size="12">We have flagged your message regarding the production API outage</text>
  <text x="760" y="416" fill="#D1D3E0" font-size="12">(Ref: ORD-2026-8812) as High Priority and routed it immediately</text>
  <text x="760" y="436" fill="#D1D3E0" font-size="12">to our escalation engineering team.</text>
  <text x="760" y="464" fill="#D1D3E0" font-size="12">Please share any error logs or affected endpoints so we can</text>
  <text x="760" y="484" fill="#D1D3E0" font-size="12">investigate without delay.</text>
  <text x="760" y="514" fill="#8B8EA3" font-size="11" font-style="italic">Guardrail: No unverified SLA credits or invented policies promised.</text>

  <!-- Static Concept Action Buttons -->
  <rect x="740" y="556" width="234" height="42" rx="10" fill="url(#mailPurple)"/>
  <text x="857" y="582" fill="#13141F" font-size="13" font-weight="700" text-anchor="middle">Approve &amp; Queue Reply</text>

  <rect x="990" y="556" width="234" height="42" rx="10" fill="#13141F" stroke="#3A3B4C"/>
  <text x="1107" y="582" fill="#D1D3E0" font-size="13" font-weight="600" text-anchor="middle">Edit or Reject Draft</text>

  <rect x="740" y="612" width="484" height="34" rx="8" fill="#0D0E19" stroke="#33202A"/>
  <text x="756" y="633" fill="#FFB4A6" font-size="11" font-weight="600">Safety Rule: Outbound Gmail node remains disabled until human approval &amp; OAuth setup.</text>

  <text x="32" y="694" fill="#8B8EA3" font-size="11">MailFlow — Intelligent Email Automation · Static Dashboard Concept Preview (Non-Interactive Presentation Visual)</text>
</svg>

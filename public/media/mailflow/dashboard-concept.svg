<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="mailPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#F8F8FC"/>

  <!-- Top Header -->
  <rect width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="32" y="18" width="28" height="28" rx="8" fill="url(#mailPurple)"/>
  <text x="46" y="37" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">M</text>
  <text x="72" y="33" fill="#18181B" font-size="16" font-weight="700">MailFlow AI Triage &amp; Approval Console</text>
  <text x="72" y="50" fill="#6B7280" font-size="11">Semantic Classification, Priority Detection &amp; Human-Approved Drafts</text>

  <!-- Honest Concept Preview Badge -->
  <rect x="920" y="18" width="328" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <circle cx="938" cy="32" r="4" fill="#7C3AED"/>
  <text x="950" y="36" fill="#5B21B6" font-size="11" font-weight="700">CONCEPT PREVIEW · STATIC PRESENTATION VISUAL</text>

  <!-- KPI Row -->
  <rect x="32" y="88" width="288" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="52" y="116" fill="#6B7280" font-size="12" font-weight="600">EMAILS TRIAGED (SAMPLE)</text>
  <text x="52" y="156" fill="#18181B" font-size="30" font-weight="700">218</text>
  <text x="140" y="154" fill="#7C3AED" font-size="12" font-weight="600">7 AI Categories</text>

  <rect x="340" y="88" width="288" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="360" y="116" fill="#6B7280" font-size="12" font-weight="600">HIGH PRIORITY / URGENT</text>
  <text x="360" y="156" fill="#B91C1C" font-size="30" font-weight="700">14</text>
  <rect x="424" y="135" width="166" height="24" rx="12" fill="#FEE2E2"/>
  <text x="507" y="151" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">Hybrid SLA Escalation</text>

  <rect x="648" y="88" width="288" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="668" y="116" fill="#6B7280" font-size="12" font-weight="600">AWAITING HUMAN APPROVAL</text>
  <text x="668" y="156" fill="#4C1D95" font-size="30" font-weight="700">19</text>
  <rect x="734" y="135" width="176" height="24" rx="12" fill="#F5F3FF"/>
  <text x="822" y="151" fill="#6D28D9" font-size="11" font-weight="700" text-anchor="middle">Zero Unapproved Sends</text>

  <rect x="956" y="88" width="292" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="976" y="116" fill="#6B7280" font-size="12" font-weight="600">AVG DRAFT READY TIME</text>
  <text x="976" y="156" fill="#18181B" font-size="30" font-weight="700">2.4s</text>
  <text x="1064" y="154" fill="#047857" font-size="12" font-weight="600">Gemini Contextual Draft</text>

  <!-- Left Panel: Categorized Inbox & Urgency Queue -->
